name: goodmcp-local

x-app: &app
  image: goodmcp-g1:local
  build:
    context: ..
    dockerfile: infra/Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  environment: &app-env
    HUB_DB_HOST: postgres
    HUB_DB_NAME: goodmcp
    HUB_STORAGE_ROOT: /data
  networks: [private]
  logging: &logging
    driver: json-file
    options: {max-size: 5m, max-file: "2"}

services:
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_DB: goodmcp
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin_password]
    volumes: [postgres_data:/var/lib/postgresql]
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30]
    networks: [private]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d goodmcp"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: *logging

  caddy:
    image: goodmcp-caddy:local
    build:
      context: .
      dockerfile: Dockerfile.caddy
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${HUB_PORT:-18080}:8080"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro]
    tmpfs: ["/data:uid=10001,gid=10001", "/config:uid=10001,gid=10001"]
    networks: [gateway]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging: *logging

  api:
    <<: *app
    secrets: [runtime_password]
    networks: [private, gateway]
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    volumes: [artifacts:/data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 3s
      timeout: 4s
      retries: 30

  worker:
    <<: *app
    command: [python, -m, apps.api.worker]
    secrets: [runtime_password]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    volumes: [artifacts:/data]

  migrate:
    <<: *app
    profiles: [ops]
    command: [alembic, -c, infra/alembic.ini, upgrade, head]
    secrets: [migrator_password]
    mem_limit: 256m
    cpus: 1

  admin:
    <<: *app
    profiles: [ops]
    command: [python, -m, goodmcp.admin, owner]
    secrets: [admin_password, migrator_password, runtime_password, owner_password]
    environment:
      <<: *app-env
      HUB_OWNER_EMAIL: ${HUB_OWNER_EMAIL:-owner@local.invalid}
      HUB_ALLOW_TEST_FIXTURES: ${HUB_ALLOW_TEST_FIXTURES:-0}
    mem_limit: 256m
    cpus: 1

  tests:
    <<: *app
    profiles: [test]
    command: [python, -m, pytest, -p, no:cacheprovider, -v, tests]
    secrets: [runtime_password]
    volumes: [artifacts:/data]
    mem_limit: 512m
    cpus: 1

networks:
  private: {internal: true}
  gateway: {}
volumes:
  postgres_data:
  artifacts:
secrets:
  admin_password: {file: "${HUB_SECRETS_DIR:-../.local/secrets}/admin_password"}
  migrator_password: {file: "${HUB_SECRETS_DIR:-../.local/secrets}/migrator_password"}
  runtime_password: {file: "${HUB_SECRETS_DIR:-../.local/secrets}/runtime_password"}
  owner_password: {file: "${HUB_SECRETS_DIR:-../.local/secrets}/owner_password"}
