[project]
name = "goodmcp-hub"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
  "SQLAlchemy==2.1.6", "alembic==1.20.1", "psycopg[binary]==3.3.6",
  "httpx==0.28.1", "pytest>=8,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
